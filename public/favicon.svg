<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- AAO mark scaled into a rounded square for browser tabs. -->
  <rect width="100" height="100" rx="20" fill="#1DBF1D"/>
  <defs><clipPath id="f"><polygon points="100,0 100,100 0,100"/></clipPath></defs>
  <g clip-path="url(#f)">
    <rect width="100" height="100" fill="#158210" rx="20"/>
  </g>
  <g transform="translate(50 50) scale(0.78) translate(-50 -50)">
    <circle cx="50" cy="50" r="27" fill="#fff"/>
    <circle cx="50" cy="50" r="21.5" fill="#FFDA08"/>
  </g>
</svg>
