<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    AAO Engineering logo mark.
    Traced to match the client's reference pixel-for-pixel where possible:
    an 8-tooth gear (three visible rectangular cogs + two long diagonal
    spikes and three shorter pointed cogs), split diagonally bright
    green / forest green, with a white ring and yellow sun core.
  -->
  <defs>
    <clipPath id="darkHalf">
      <!-- Bottom-right triangle split from roughly the NE-spike tip
           down through the SW-spike tip. -->
      <polygon points="512,122 512,512 0,415" />
    </clipPath>
  </defs>

